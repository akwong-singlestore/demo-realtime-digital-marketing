name: build-docker-image

# NOTE: This workflow is expected to fail until org permissions are fixed
# The hosted demo (digital-marketing.labs.singlestore.com) uses GitHub Pages
# and does NOT depend on this Docker build workflow.
#
# This workflow builds a Docker image for self-hosting scenarios.
# To fix: An organization admin needs to enable write permissions at:
# https://github.com/organizations/singlestore-labs/settings/actions

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only run on the upstream repo, not forks, and only from main branch
    if: |
      github.repository == 'singlestore-labs/demo-realtime-digital-marketing' &&
      github.ref == 'refs/heads/main'
    # Requires organization admin to configure GHCR permissions:
    # Settings -> Actions -> General -> Workflow permissions -> Read and write
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=ghcr.io/singlestore-labs/demo-realtime-digital-marketing:latest" >> $GITHUB_OUTPUT
          else
            # For non-main branches, use branch name as tag
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///' | sed 's/\//-/g')
            echo "tags=ghcr.io/singlestore-labs/demo-realtime-digital-marketing:$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
